<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="شجرة وأثر">
  <defs>
    <linearGradient id="crown" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#43D9A3"/>
      <stop offset="52%" stop-color="#17A277"/>
      <stop offset="100%" stop-color="#0A5C42"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6E51"/>
      <stop offset="100%" stop-color="#07412C"/>
    </linearGradient>
    <linearGradient id="seed" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F7CC6B"/>
      <stop offset="100%" stop-color="#D68F26"/>
    </linearGradient>

    <!-- أخاديد البصمة محفورة من التاج -->
    <mask id="ridges">
      <rect x="0" y="0" width="200" height="200" fill="#000"/>
      <path d="M 100 16 C 134 16 161 43 161 77 C 161 103 145 125 122 133 L 78 133 C 55 125 39 103 39 77 C 39 43 66 16 100 16 Z" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="7" stroke-linecap="round">
        <path d="M 54.9 93.4 A 48 48 0 1 1 145.1 93.4"/>
        <path d="M 65.2 86.3 A 36 36 0 0 1 95 41.4"/>
        <path d="M 110 42.5 A 36 36 0 0 1 134.8 86.3"/>
        <path d="M 76.4 81.2 A 24 24 0 0 1 91.8 54.4"/>
        <path d="M 102.1 53.1 A 24 24 0 0 1 123.6 81.2"/>
      </g>
    </mask>
  </defs>

  <!-- التاج -->
  <path d="M 100 16 C 134 16 161 43 161 77 C 161 103 145 125 122 133 L 78 133 C 55 125 39 103 39 77 C 39 43 66 16 100 16 Z"
        fill="url(#crown)" mask="url(#ridges)"/>

  <!-- البذرة في قلب البصمة -->
  <path d="M 100 60 C 107 66 107 76 100 82 C 93 76 93 66 100 60 Z" fill="url(#seed)"/>

  <!-- الجذع -->
  <path d="M 93 126 L 107 126 C 108 146 110 162 114 176 L 86 176 C 90 162 92 146 93 126 Z" fill="url(#trunk)"/>

  <!-- الأرض -->
  <path d="M 64 182 L 136 182" fill="none" stroke="url(#trunk)" stroke-width="7" stroke-linecap="round"/>
</svg>
